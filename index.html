<!DOCTYPE html>
<html>
<head>
    <title>AI Diwali - Shravani</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>✨ Happy Diwali ✨</h1>

    <h2>Welcome to AI Diwali</h2>

    <p>Where Artificial Intelligence
    meets Indian Tradition!</p>
<div class="diya-container">

    <div class="flame"></div>

    <div class="diya">
        <div class="oil"></div>
    </div>

</div>    
<select id="greetingStyle">

    <option value="traditional">
        Traditional
    </option>

    <option value="modern">
        Modern
    </option>

    <option value="friendly">
        Friendly
    </option>

</select>
    <input
    type="text"
    id="userName"
    placeholder="Enter your name"
>

<button onclick="generateGreeting()">
    Generate My Greeting ✨
</button>

<div class="greeting-card">

    <h2>🪔 Your Special Diwali Wish 🪔</h2>

    <h3 id="greetingMessage"></h3>

</div>

    <script src="script.js"></script>

<!-- Fireworks animation -->
<div class="firework firework-one"></div>

<div class="firework firework-two"></div>

<div class="firework firework-three"></div>


</body>
</html>
<button onclick="copyGreeting()">
    Copy My Greeting 💌
</button>
